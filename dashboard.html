<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMG Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 414px;
            background-color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* 1. Image Slider Section */
        .slider-container {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background-color: #0d1e47;
        }

        .slides {
            display: flex;
            width: 500%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            width: 20%;
            height: 100%;
            flex-shrink: 0;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. Announcement Ticker (Moved Below Image) */
        .announcement-bar {
            background-color: #242424;
            padding: 10px 14px;
            font-size: 12px;
            color: #d8d8d8;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .announcement-bar i {
            color: #ffffff;
        }

        /* 3. Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            row-gap: 22px;
            column-gap: 10px;
            padding: 24px 10px 15px 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }

        .gold-icon {
            font-size: 32px;
            background: linear-gradient(135deg, #ffe066 0%, #d4af37 40%, #aa7c11 70%, #fff0a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.8));
        }

        .menu-label {
            font-size: 11px;
            color: #d0d0d0;
            font-weight: 400;
            line-height: 1.2;
        }

        /* 4. Task Hall Section */
        .task-hall-container {
            padding: 10px 14px 20px 14px;
        }

        .task-hall-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .task-card {
            background: linear-gradient(135deg, #ee9ca7 0%, #ff6b6b 100%);
            border-radius: 6px;
            padding: 8px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .task-card i {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            padding: 3px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 414px;
            height: 58px;
            background-color: #0e0e0e;
            border-top: 1px solid #222222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #777777;
            text-decoration: none;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #2f80ed;
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- Image Carousel/Slider (5 Images) -->
    <div class="slider-container">
        <div class="slides" id="slideTrack">
            <!-- ፎቶዎቹን በራስህ የፎቶ ፋይሎች ስም ቀይራቸው -->
            <div class="slide"><img src="jon.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="jon4.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="jon3.jpg" alt="Slide 3"></div>
            <div class="slide"><img src="jon2.jpg" alt="Slide 4"></div>
            <div class="slide"><img src="jon1.jpg" alt="Slide 5"></div>
        </div>
    </div>

    <!-- Announcement Bar (Under the photo) -->
    <div class="announcement-bar">
        <i class="fa-solid fa-volume-high"></i>
        <span>Congratulations member 93****73 for receiving a reward of 1928.00ETB !</span>
    </div>

    <!-- 12 Icon Menu Grid -->
    <div class="menu-grid">
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-wallet gold-icon"></i></div>
            <div class="menu-label">Recharge</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-sack-dollar gold-icon"></i></div>
            <div class="menu-label">Withdraw</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-earth-americas gold-icon"></i></div>
            <div class="menu-label">Invitation<br>Rewards</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-city gold-icon"></i></div>
            <div class="menu-label">Company<br>Profile</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-calendar-check gold-icon"></i></div>
            <div class="menu-label">Login Reward</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-clipboard-list gold-icon"></i></div>
            <div class="menu-label">Schedule</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-chart-line gold-icon"></i></div>
            <div class="menu-label">Finance</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-bag-shopping gold-icon"></i></div>
            <div class="menu-label">Points Mail</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-newspaper gold-icon"></i></div>
            <div class="menu-label">News Center</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-gift gold-icon"></i></div>
            <div class="menu-label">Gift</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-envelope-open-text gold-icon"></i></div>
            <div class="menu-label">Message</div>
        </div>
        <div class="menu-item">
            <div class="icon-box"><i class="fa-solid fa-vault gold-icon"></i></div>
            <div class="menu-label">Surprise Cash</div>
        </div>
    </div>

    <!-- Task Hall Section -->
    <div class="task-hall-container">
        <div class="task-hall-title">Task Hall</div>
        <div class="task-grid">
            <div class="task-card"><span>Trainee<br>Member</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U1</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U2</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U3</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U4</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U5</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U6</span> <i class="fa-solid fa-play"></i></div>
            <div class="task-card"><span>U7</span> <i class="fa-solid fa-play"></i></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house nav-icon"></i><span>Home</span></div>
        <div class="nav-item"><i class="fa-solid fa-square-check nav-icon"></i><span>Task</span></div>
        <div class="nav-item"><i class="fa-solid fa-ring nav-icon"></i><span>Profit</span></div>
        <div class="nav-item"><i class="fa-solid fa-gem nav-icon"></i><span>VIP</span></div>
        <div class="nav-item"><i class="fa-solid fa-user nav-icon"></i><span>Account</span></div>
    </div>
</div>

<!-- JavaScript Slider Automation -->
<script>
    let currentIndex = 0;
    const slideTrack = document.getElementById('slideTrack');
    const totalSlides = 5;

    setInterval(() => {
        currentIndex = (currentIndex + 1) % totalSlides;
        slideTrack.style.transform = `translateX(-${currentIndex * 20}%)`;
    }, 3000);
</script>

</body>
</html>
